name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Self-check (docs must pass Claim Check, runnable blocks included)
        run: npm run self-check -- --run

      - name: Self-check JUnit report
        if: always()
        run: node dist/cli.js . --format junit --output claim-check-report.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-check-report-node-${{ matrix.node }}
          path: claim-check-report.xml
          if-no-files-found: ignore

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Claim Check on this repository, through the action
        uses: ./
        with:
          args: --run
          sarif: claim-check.sarif

      - name: Upload SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: claim-check-sarif
          path: claim-check.sarif

      - name: Claim Check on a drifted fixture (must find drift)
        id: drifted
        uses: ./
        with:
          path: test/fixtures/scripts/drifted
          sarif: ''
          annotations: 'false'
          summary: 'false'
          fail: 'false'

      - name: Check the action reported the drift
        env:
          EXIT_CODE: ${{ steps.drifted.outputs.exit-code }}
          ERRORS: ${{ steps.drifted.outputs.errors }}
        run: |
          echo "exit code $EXIT_CODE, $ERRORS errors"
          test "$EXIT_CODE" = 1
          test "$ERRORS" -gt 0
