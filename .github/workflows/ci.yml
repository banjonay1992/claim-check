name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Self-check (docs must pass Claim Check, runnable blocks included)
        run: npm run self-check -- --run

      - name: Self-check JUnit report
        if: always()
        run: node dist/cli.js . --format junit --output claim-check-report.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-check-report-node-${{ matrix.node }}
          path: claim-check-report.xml
          if-no-files-found: ignore
