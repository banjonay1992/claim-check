name: Release

# Publishes the package to npm when a GitHub release is published.
# It only runs when the repository variable NPM_PUBLISH is set to "true",
# and it uses npm trusted publishing (OIDC), so no npm token is stored here.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish to npm
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Self-check
        run: npm run self-check -- --run

      - name: Publish
        run: npm publish --provenance --access public
